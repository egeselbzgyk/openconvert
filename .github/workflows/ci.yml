name: ci
# `phase/**` is here because of what its absence cost. Phases 0, 1 and 2 were all developed on
# `phase/00-bootstrap`, which matched neither trigger, so this workflow did not run once in four
# days — and three Definition-of-Done entries said "Linux and macOS are CI's job" the whole time.
# When it finally ran, five of eight jobs failed, two of them on code from Phase 1.
on: { pull_request: {}, push: { branches: [main, "phase/**"] } }
# Namespaced by event, and deliberately so. `github.head_ref` is the *pull request author's*
# branch name, and this repository is public: anyone may fork it, name a branch `main`, and open
# a pull request. A group keyed on the bare name would then put that stranger's run in the same
# group as a push to `main` and, with `cancel-in-progress`, let them cancel the run that gates a
# release, from the outside, at will. Prefixing the event puts `ci-pull_request-main` and
# `ci-push-main` beyond each other's reach.
#
# `refs/heads/…` is not a fix for this: a branch may legally be *named* `refs/heads/main`, and
# `head_ref` reports the short name, so the forged value collides just as well.
#
# The cost is that a pull request on a phase branch runs CI twice, once per event. That is minutes
# of runner time against an availability hole reachable by anyone on the internet.
#
# `cancel-in-progress` is off for `main`: superseding the gate run of a merged commit loses the
# only evidence that the merged tree is green. Every other ref keeps it, so a phase branch still
# cancels its own superseded runs.
concurrency:
  group: "ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}"
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
env: { CARGO_TERM_COLOR: always, RUSTFLAGS: "-D warnings", INSTA_UPDATE: "no" }

# Why the engine jobs say `--exclude openconvert-desktop`:
#
# Building the Tauri crate inside `--workspace` would cost every job on every OS a GUI toolchain:
# GTK and WebKit on Linux, a built `ui/dist`, and a staged sidecar binary, because `tauri-build`
# resolves `externalBin` at build time. It is bought once, on Linux, in the `desktop` job below,
# which also runs the crate's tests — the supervisor, the queue, the job-spec rules, the privacy
# gate (12.13) and, with `engine-integration`, the real engine's cancel and stale-sidecar paths
# (12.6, 12.17) and the app-owned model server's lifecycle against `oc-stub-llama-server`. The UI's own tests (Vitest, svelte-check, the lint, and the Playwright spec under
# the shipped CSP) are the `ui` job's. Phase 15 owns cross-platform packaging; when it arrives,
# the `desktop` job is where the matrix goes.
#
# `cargo fmt --all` and `cargo deny` still cover the crate — neither builds it.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1, components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude openconvert-desktop --all-targets --all-features --locked -- -D warnings
      # Repository rules: no skipped tests, no unnumbered markers, and on a release
      # branch no placeholder values left in models.toml.
      - run: cargo run -p xtask -- ci-lint
      - run: cargo run -p xtask -- thresholds-lint    # provenance + expiry
      # docs/VERSIONING.md: an IR, protocol, prompt or job-spec change without its version bump
      # since the last release (PHASE 15 detail 8). Notes only until the first release.
      - run: cargo run -p xtask -- bump-rules-check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: taiki-e/install-action@v2
        with: { tool: cargo-deny }
      # `--config` and `--all-features` are *global* options and have to precede `check`;
      # placed after it, cargo-deny reads the first `WHICH` argument as a subcommand and
      # fails with `unrecognized subcommand 'licenses'`. Run on the host toolchain rather
      # than in the action's musl container, which cannot honour `rust-toolchain.toml`.
      #
      # What ships: licences, bans, sources and advisories, all hard gates, no exceptions.
      - run: cargo deny --all-features check
      # What builds: the same licence, ban and source policy over the developer tooling,
      # which is a repository obligation regardless of what ships.
      - run: cargo deny --all-features --config deny.tools.toml check licenses bans sources
      # Advisories in the tooling tree are reported, not enforced. See deny.tools.toml for
      # why, and docs/SECURITY.md 9 for the scope of each gate.
      - run: cargo deny --all-features --config deny.tools.toml check advisories
        continue-on-error: true

  test:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # Belt and braces after the linker ran the runner out of disk (CI 35398970632): every
      # integration test statically links the whole pipeline, and on Linux the debug info is
      # embedded in the ELF, so the workspace's test executables are the largest thing either job
      # writes. `[profile.dev] debug = "line-tables-only"` cut that by an order of magnitude and is
      # the actual fix; this reclaims the ~25 GB of preinstalled toolchains neither job uses, and
      # prints the headroom so the next person does not have to infer it from a bus error.
      - name: reclaim runner disk
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest          # cargo-nextest 0.9.x
      - run: cargo run -p xtask -- vendor-pdfium      # SHA-256-pinned bblanchon/pdfium-binaries
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project eval
      - run: cargo run -p xtask -- fixtures           # compile the Typst fixtures
      # And D18's separate tagged bucket. `meta::struct_tree_is_read_from_the_catalogue`
      # reads `f01_..__tagged.pdf`, which only the flag produces.
      - run: cargo run -p xtask -- fixtures --keep-structtree
      - run: cargo nextest run --workspace --exclude openconvert-desktop --locked --profile ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: "nextest-${{ matrix.os }}", path: target/nextest/ci/junit.xml }

  # The Tauri shell: compiled, linted, and given everything `tauri-build` needs, in one place.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1, components: clippy }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # WebKitGTK 4.1 is the Tauri 2 requirement on Ubuntu 24.04.
      - run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      # `frontendDist` points at `../ui/dist`, which is git-ignored build output.
      - run: npm ci --prefix apps/desktop/ui && npm --prefix apps/desktop/ui run build
      # `externalBin` resolves at build time, so the engine and `llama-server` have to exist and
      # be staged under the target-triple names Tauri looks for before the shell will compile at
      # all; `stage-sidecars` also stages PDFium and the server's libraries (PHASE 15 detail 1),
      # which is why the two vendored natives are fetched first.
      # The stub llama-server the app's model-server tests start is an `oc-testkit` binary.
      - run: cargo build -p openconvert -p oc-testkit --bins --locked
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fetch-llama-server
      - run: cargo run -p xtask -- stage-sidecars
      - run: cargo clippy -p openconvert-desktop --all-targets --all-features --locked -- -D warnings
      - uses: taiki-e/install-action@nextest
      - run: cargo nextest run -p openconvert-desktop --features engine-integration --locked --profile ci

  no-network:                                          # D13.9, R8 §A7
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Belt and braces after the linker ran the runner out of disk (CI 35398970632): every
      # integration test statically links the whole pipeline, and on Linux the debug info is
      # embedded in the ELF, so the workspace's test executables are the largest thing either job
      # writes. `[profile.dev] debug = "line-tables-only"` cut that by an order of magnitude and is
      # the actual fix; this reclaims the ~25 GB of preinstalled toolchains neither job uses, and
      # prints the headroom so the next person does not have to infer it from a bus error.
      - name: reclaim runner disk
        if: runner.os == 'Linux'
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo run -p xtask -- vendor-pdfium && cargo run -p xtask -- fixtures
      # Everything the run below will need, fetched and compiled while there is still a
      # network. `cargo nextest run` shells out to `cargo metadata`, which resolves the whole
      # workspace including `xtask`'s dependencies — so a registry warmed only by building
      # the engine leaves it reaching for `static.crates.io` from inside the namespace, which
      # is exactly the failure this job is supposed to be able to distinguish from a real one.
      - run: cargo fetch --locked
      # The engine only. The Tauri shell's binary is not what this job is about, and
      # building it here would drag in the GUI toolchain for nothing.
      - run: cargo build -p openconvert --locked --bins
      - run: cargo nextest list -p oc-core -p openconvert --locked -E 'test(convert_) or test(inspect_)'
      - name: conversions under an empty network namespace
        run: |
          sudo unshare -n -- sudo -u "$USER" env "PATH=$PATH" \
            cargo nextest run -p oc-core -p openconvert --locked -E 'test(convert_) or test(inspect_)'
      # A8.3: every tier below nightly makes zero live model calls. `oc-ai` has no socket-capable
      # dependency (test 8.15) and replays cassettes through a provider that holds no transport;
      # here the whole suite — gates, stub, cassettes — also runs where a socket cannot open at
      # all, so a call that slipped past both would fail here rather than reach a network.
      - name: the oc-ai suite under an empty network namespace
        run: |
          sudo unshare -n -- sudo -u "$USER" env "PATH=$PATH" \
            cargo nextest run -p oc-ai --locked
      # Row 9.7: `oc-core` — the conversion path — cannot reach a socket crate. The test walks
      # Cargo.lock on every platform; this is the same claim in the form the plan states it,
      # `cargo tree -p oc-core -i ureq` printing nothing. `cargo tree -i` exits non-zero when the
      # package is absent from the graph, so the check is on its output, not its status.
      - name: assert oc-core cannot reach a socket crate
        run: |
          cargo nextest run -p oc-core --locked -E 'test(oc_core_has_no_net_dependency)'
          for crate in ureq rustls oc-net; do
            if cargo tree -p oc-core --locked -e normal,build -i "$crate" 2>/dev/null | grep -q .; then
              echo "oc-core reaches $crate"; exit 1
            fi
          done

  poppler-oracle:                                      # D15: CI-only oracle, never shipped
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      # The feature exists so this test is gated by a CI job rather than by a skip attribute,
      # which CLAUDE.md bans and `xtask ci-lint` enforces. Off, the test does not exist; on,
      # it must find `pdftotext` or fail.
      - run: cargo nextest run -p oc-pdf --features poppler-oracle --locked -E 'test(differential_)'

  # PHASE 13: the tests that need a real Tesseract 5 (A13.1, rows 13.20 and 13.21). The Linux runner
  # installs the three v1 languages; the feature turns the tests on, and with it on a missing engine
  # fails them. The scanned fixtures are committed, so this job needs no Python; `--check` proves the
  # committed ones are still what the generator makes.
  ocr:                                                 # D4, PHASE 13
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu tesseract-ocr-tur
      - run: tesseract --version && tesseract --list-langs
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project eval
      - run: uv run --project eval python -m oc_eval.generate.scan_sim --scanned-fixtures --check
      - run: cargo nextest run -p openconvert --features tesseract --locked -E 'binary(ocr_tesseract)' --no-capture

  # D6's Tier-2 gate: EPUBCheck is authoritative and it is Java, so it runs here rather than
  # on the conversion path. `epubcheck.max_errors = 0` is a binary threshold — this is the one
  # gate in Phase 5 that is not this project's opinion of its own output.
  epubcheck:                                           # D6 Tier 2 hard gate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      - run: cargo run -p xtask -- fetch-epubcheck     # pinned version + SHA-256
      # Row 5.17, acceptance criterion A5.1.
      - run: cargo nextest run -p openconvert --features epubcheck --locked -E 'test(epubcheck_zero_errors)'

  # Row 5.18 (RT A6.2). Tier 1's coverage is a measured number, not a claim, and the number may
  # never silently fall. Separate from the gate above because it needs the test corpus as well
  # as the jar, and because it is four hundred JVM launches rather than ten.
  tier1-parity:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - run: cargo run -p xtask -- fetch-epubcheck
      - run: cargo run -p xtask -- fetch-epubcheck-corpus
      # `--check` compares against the committed number and does not rewrite it: a job that
      # regenerated what it is about to compare against would pass on any input.
      - run: cargo run -p xtask -- epubcheck-parity --check

  # Row 5.5 and acceptance criterion A5.3 (D13.8). Each OS converts one fixture with
  # `dcterms:modified` pinned and uploads the sha256; this job asserts the three agree. Pure-Rust
  # image codecs and a fixed JPEG quality are what make that possible, and this is what would
  # notice if either stopped being true.
  epub-bytes:
    strategy:
      fail-fast: false
      matrix: { os: [ubuntu-latest, macos-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      - run: cargo build -p openconvert --locked
      - name: convert f07 with the timestamp pinned
        shell: bash
        run: |
          ./target/debug/openconvert convert target/fixtures/f07_verse_and_quote.pdf -o f07.epub --lang en --modified 2026-01-01T00:00:00Z --no-ai
          # `sha256sum` on Linux and on Git Bash; `shasum` on macOS, which ships neither.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum f07.epub | cut -d' ' -f1 > sha256.txt
          else
            shasum -a 256 f07.epub | cut -d' ' -f1 > sha256.txt
          fi
          cat sha256.txt
      - uses: actions/upload-artifact@v4
        with: { name: "epub-sha256-${{ matrix.os }}", path: sha256.txt }

  epub_is_byte_identical_across_os:
    runs-on: ubuntu-latest
    needs: epub-bytes
    steps:
      - uses: actions/download-artifact@v4
        with: { pattern: "epub-sha256-*", path: sums }
      - name: the three operating systems agree
        shell: bash
        run: |
          set -euo pipefail
          found=$(find sums -name sha256.txt | sort)
          echo "$found" | while read -r file; do echo "$file: $(cat "$file")"; done
          # Three legs, or the comparison is between fewer operating systems than it claims —
          # a matrix leg that failed to upload would otherwise make this job pass on two.
          legs=$(echo "$found" | grep -c .)
          if [ "$legs" -ne 3 ]; then
            echo "expected three sha256 artefacts, found $legs" >&2
            exit 1
          fi
          count=$(cat $found | sort -u | grep -c .)
          if [ "$count" -ne 1 ]; then
            echo "the operating systems produced $count different EPUBs (D13.8)" >&2
            exit 1
          fi

  # Off until Phase 6, which creates `tests/dom`. Same reasoning as `epubcheck` above.
  # D7 / R6 §11 Layer 2: a real browser measuring the emitted XHTML. Chromium at three viewports on
  # every pull request; WebKit is nightly, because it is the engine every Apple reading system uses
  # and also the slowest to install. No screenshots on either: a pixel comparison over a reflowable
  # book fails on a font-rendering difference between two runners, and a job that goes red for a
  # reason unrelated to the change teaches everyone to ignore the colour.
  #
  # The Rust steps are not decoration. The specs assert things about the markup *this* commit emits,
  # so the fixtures have to be compiled and converted here: a job dependency shares no artefacts.
  dom-checks:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      - run: cargo run -p xtask -- dom-fixtures      # convert + unpack into target/dom/
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix tests/dom
      - run: npx --prefix tests/dom playwright install --with-deps chromium
      - run: npm --prefix tests/dom test
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: dom-checks-junit, path: tests/dom/results/junit.xml }

  # The desktop UI: component tests (Vitest), types (svelte-check), the repository's UI rules
  # (`scripts/lint.mjs`: CSP, privacy, colour, casing, string keys), and then the built bundle in
  # Chromium under the CSP `tauri.conf.json` ships — keyboard-only conversion, axe, contrast in
  # both schemes (Phase 12 rows 12.14–12.16). WebKit runs the same spec nightly (`webkit-ui`).
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix apps/desktop/ui
      - run: npm --prefix apps/desktop/ui run test
      - run: npm --prefix apps/desktop/ui run check
      - run: npm --prefix apps/desktop/ui run lint
      - run: npm --prefix apps/desktop/ui run build
      - run: npm ci --prefix tests/dom
      - run: npx --prefix tests/dom playwright install --with-deps chromium
      - run: npm --prefix tests/dom run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: ui-junit, path: tests/dom/results/junit.xml }

  # Phase 7. `eval/` is never a build or runtime dependency of the shipped product (D1), and
  # the `no-network` and release jobs prove the engine needs no Python — but the eval tooling
  # is committed, redistributed under Apache-2.0 and run by contributors, so it is held to the
  # same standard as the Rust: formatted, linted, typed, tested.
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.11.28" }
      - run: uv venv eval/.venv --python 3.13
      - run: uv pip install --python eval/.venv -e "eval[dev]"
      # Row 7.13: PyMuPDF is AGPL (D15). Checked before anything else runs, because the point
      # is to fail on a dependency somebody added rather than on a test that used it.
      - run: eval/.venv/bin/python -m pytest eval/tests/test_no_agpl.py -q
      - run: eval/.venv/bin/python -m ruff check eval corpus
      - run: eval/.venv/bin/python -m ruff format --check eval corpus
      - run: eval/.venv/bin/python -m mypy eval/src/oc_eval eval/tests corpus
      # PHASE 10 rows 10.17 and 10.18: docs/AI_EVALUATION.md is the render of the committed
      # outcomes, and no enabled AI task exceeds the false-repair bound in any category.
      - run: cd eval && .venv/bin/python -m oc_eval.compare --check
      - run: cd eval && .venv/bin/python -m oc_eval.compare --gate
      # `cargo run -p xtask -- fixtures --keep-structtree` is what the struct-tree ground-truth
      # test reads; it builds it itself if it is missing, and doing it here keeps that off the
      # critical path of a single test.
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures --keep-structtree
      - run: eval/.venv/bin/python -m pytest eval/tests -q

  # Phase 7 row 7.9 and A7.1: the corpus manifest is a contract, and CI enforces it. It reads
  # only the manifest, never the files, so it costs a second and needs no downloads.
  corpus-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.11.28" }
      - run: uv venv eval/.venv --python 3.13
      - run: uv pip install --python eval/.venv -e eval
      - run: eval/.venv/bin/python -m oc_eval corpus lint
      - run: eval/.venv/bin/python -m oc_eval corpus stats

  # Placeholder wired in Phase 0, populated from Phase 7 onward.
  nightly-placeholder:
    if: false
    runs-on: ubuntu-latest
    steps: [{ run: "echo see .github/workflows/nightly.yml" }]
