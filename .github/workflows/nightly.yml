name: nightly
# IMPLEMENTATION_PLAN.md §1.9: the job names exist from Phase 0 so that no later phase
# has to create this workflow from scratch. Each body is replaced in the phase that owns it.
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch: {}
concurrency: { group: nightly, cancel-in-progress: true }
env: { CARGO_TERM_COLOR: always, INSTA_UPDATE: "no" }

jobs:
  # Phase 7 row 7.14. The whole corpus through the shipped binary, scored per file and per
  # stratum, with the ours(*)-versus-real gap recorded to the committed trend (row 7.10).
  #
  # A file the manifest names and the download does not produce is reported as **missing**
  # rather than skipped: a nightly that quietly scored the forty files it happened to have is
  # a nightly whose number means something different every night, and the trend built on it
  # would be worthless.
  full-corpus:            # Phase 7
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.11.28" }
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo build -p openconvert --release --locked
      - run: uv venv eval/.venv --python 3.13
      - run: uv pip install --python eval/.venv -e eval
      - run: eval/.venv/bin/python -m oc_eval corpus lint
      - run: eval/.venv/bin/python -m oc_eval corpus download
      - run: |
          eval/.venv/bin/python -m oc_eval run             --binary target/release/openconvert             --out eval/out/report.json
      - run: |
          eval/.venv/bin/python - <<'PY'
          import json, pathlib
          report = json.loads(pathlib.Path("eval/out/report.json").read_text(encoding="utf-8"))
          rows = [
              {
                  "stratum": row["stratum"],
                  "file_id": row["file_id"],
                  "metric": row["metric"],
                  "value": row["value"],
              }
              for row in report["per_file"]
              if row["metric"] == "converted"
          ]
          pathlib.Path("eval/out/scores.json").write_text(json.dumps(rows), encoding="utf-8")
          PY
          eval/.venv/bin/python -m oc_eval report trend eval/out/scores.json
      - uses: actions/upload-artifact@v4
        with:
          name: full-corpus-report
          path: |
            eval/out/report.json
            eval/out/trend.json
            eval/out/trend.png

  # The same structural DOM assertions as the `dom-checks` job on every PR, in WebKit: the engine
  # every Apple reading system renders with, and the one whose line breaking differs most from
  # Chromium's. Nightly rather than per-PR because installing it costs minutes and because a book
  # that overflows in WebKit and not in Chromium is a stylesheet finding, not a regression in the
  # change under review.
  webkit-dom:             # Phase 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      - run: cargo run -p xtask -- dom-fixtures
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix tests/dom
      - run: npx --prefix tests/dom playwright install --with-deps webkit
      - run: npm --prefix tests/dom run test:webkit

  # Phase 7, TEST_STRATEGY §3.8. A suite that passes when the code is wrong is a suite that
  # was never testing the code. `--in-place` is deliberately not used: the report is the
  # output, and a surviving mutant is a finding to read rather than a build to fail, because
  # the honest response to one is usually a new test and not a revert.
  mutation-testing:       # Phase 7 (cargo-mutants + mutmut)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-mutants
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      # The crates whose correctness is arithmetic rather than I/O, which is where a surviving
      # mutant means something. `oc-pdf` is excluded: most of it is a binding, and mutating a
      # PDFium call produces a mutant no test could catch and no reader would learn from.
      - run: cargo mutants --package oc-layout --package oc-structure --package oc-validate --no-shuffle -j 2
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mutants-out, path: mutants.out }

  # Phase 7. The property tests run at 24-256 cases on a PR so the suite stays fast; the
  # domains they sample are far larger than that, and a counterexample that needs a thousand
  # cases to find is still a counterexample.
  proptest-deep:          # Phase 7 (PROPTEST_CASES=4096)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env: { PROPTEST_CASES: "4096" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      - run: cargo nextest run --workspace --locked
      - name: a shrunk counterexample is worth more than the log it is buried in
        if: failure()
        run: cat **/proptest-regressions/*.txt || true

  # Phase 7 rows 7.11 and 7.12. The budget assertions are behind the `bench` cargo feature
  # rather than running on every PR: a wall-clock assertion on a shared runner measures the
  # runner, and a gate that fails for that reason is one people learn to re-run until it
  # passes. Here the runner is this job's alone.
  bench:                  # Phase 7 (criterion + peak RSS)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - run: cargo run -p xtask -- vendor-pdfium
      - name: the per-page and per-stage budgets (D13.11)
        run: cargo nextest run -p openconvert --features bench --locked -E 'binary(perf_budget)'
      - name: the criterion trend beside the gate
        run: cargo bench -p openconvert --bench end_to_end --bench stages -- --warm-up-time 1 --measurement-time 5
      - uses: actions/upload-artifact@v4
        with: { name: criterion, path: target/criterion }

  # Rows 9.15 and 9.16: the live tests, against the pinned llama-server and the default model, both
  # fetched and verified before anything runs. This job fails at `model pull` while `models.toml`
  # still carries `TODO_` placeholders, and that is deliberate: a live gate that passes without a
  # model is not a gate. Re-recording the cassettes against the live model lands with
  # Phase 10's inventories, which are what a cassette is recorded from.
  live-llm-cassette-refresh:   # Phase 9
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - name: fetch the pinned llama-server
        run: echo "OC_LLAMA_SERVER=$(cargo run -q -p xtask -- fetch-llama-server)" >> "$GITHUB_ENV"
      - name: pull the default model through the engine's own verified download
        run: |
          cargo run -q -p openconvert --locked -- model pull qwen3-1.7b-q4_k_m --dir "$RUNNER_TEMP/models"
          echo "OC_LIVE_MODEL=$RUNNER_TEMP/models/qwen3-1.7b-q4_k_m/Qwen3-1.7B-Q4_K_M.gguf" >> "$GITHUB_ENV"
      - name: rows 9.15 and 9.16
        run: cargo nextest run -p oc-testkit --features live-llm --locked -E 'binary(live_llm)'


  # Tier 3 (D6, PIPELINE §11): zero serious violations, and every required accessibility metadata
  # field present. Ace is a Node application, so the gate is behind the `ace` cargo feature — a
  # feature is something a job turns on and a developer can too, while an ignored test is one nobody
  # ever runs again. Nightly rather than per-PR because installing Ace pulls a browser of its own.
  ace-a11y:               # Phase 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global @daisy/ace
      # Ace runs axe-core inside **Electron**, which brings two Linux requirements neither the
      # package nor its CLI can satisfy on its own — `bin/ace.js` spawns Electron with no flags, so
      # there is nothing to pass through.
      #
      # 1. Chromium's SUID sandbox helper has to be root-owned and setuid. `npm install --global`
      #    unpacks it as the runner user, and Electron then aborts rather than run unsandboxed:
      #    "The SUID sandbox helper binary was found, but is not configured correctly … you need to
      #    make sure that …/chrome-sandbox is owned by root and has mode 4755" (nightly CI
      #    35459416781). Configuring the sandbox is the remedy the error asks for; disabling it
      #    with `ELECTRON_DISABLE_SANDBOX` would also work and would turn off a security boundary
      #    to run a checker over our own fixtures, which is the wrong trade even on a throwaway
      #    runner.
      # 2. A display. The runner has no X server, and Electron on Linux needs one even for a window
      #    it never shows, so the test runs under Xvfb.
      - name: let Ace's Electron start on a headless runner
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sandbox="$(npm root -g)/@daisy/ace/node_modules/electron/dist/chrome-sandbox"
          ls -l "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          ls -l "$sandbox"
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      - run: xvfb-run -a cargo nextest run -p openconvert --features ace --locked -E 'test(ace_zero_serious_violations)'
