name: nightly
# IMPLEMENTATION_PLAN.md §1.9: the job names exist from Phase 0 so that no later phase
# has to create this workflow from scratch. Each body is replaced in the phase that owns it.
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch: {}
concurrency: { group: nightly, cancel-in-progress: true }
env: { CARGO_TERM_COLOR: always, INSTA_UPDATE: "no" }

jobs:
  full-corpus:            # Phase 7
    runs-on: ubuntu-latest
    steps: [{ run: 'echo "not yet implemented (Phase 7)"' }]

  # The same structural DOM assertions as the `dom-checks` job on every PR, in WebKit: the engine
  # every Apple reading system renders with, and the one whose line breaking differs most from
  # Chromium's. Nightly rather than per-PR because installing it costs minutes and because a book
  # that overflows in WebKit and not in Chromium is a stylesheet finding, not a regression in the
  # change under review.
  webkit-dom:             # Phase 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      - run: cargo run -p xtask -- dom-fixtures
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix tests/dom
      - run: npx --prefix tests/dom playwright install --with-deps webkit
      - run: npm --prefix tests/dom run test:webkit

  mutation-testing:       # Phase 7 (cargo-mutants + mutmut)
    runs-on: ubuntu-latest
    steps: [{ run: 'echo "not yet implemented (Phase 7)"' }]

  proptest-deep:          # Phase 7 (PROPTEST_CASES=4096)
    runs-on: ubuntu-latest
    steps: [{ run: 'echo "not yet implemented (Phase 7)"' }]

  bench:                  # Phase 7 (criterion + peak RSS)
    runs-on: ubuntu-latest
    steps: [{ run: 'echo "not yet implemented (Phase 7)"' }]

  live-llm-cassette-refresh:   # Phase 9
    runs-on: ubuntu-latest
    steps: [{ run: 'echo "not yet implemented (Phase 9)"' }]

  # Tier 3 (D6, PIPELINE §11): zero serious violations, and every required accessibility metadata
  # field present. Ace is a Node application, so the gate is behind the `ace` cargo feature — a
  # feature is something a job turns on and a developer can too, while an ignored test is one nobody
  # ever runs again. Nightly rather than per-PR because installing Ace pulls a browser of its own.
  ace-a11y:               # Phase 6
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --global @daisy/ace
      # Ace runs axe-core inside **Electron**, which brings two Linux requirements neither the
      # package nor its CLI can satisfy on its own — `bin/ace.js` spawns Electron with no flags, so
      # there is nothing to pass through.
      #
      # 1. Chromium's SUID sandbox helper has to be root-owned and setuid. `npm install --global`
      #    unpacks it as the runner user, and Electron then aborts rather than run unsandboxed:
      #    "The SUID sandbox helper binary was found, but is not configured correctly … you need to
      #    make sure that …/chrome-sandbox is owned by root and has mode 4755" (nightly CI
      #    35459416781). Configuring the sandbox is the remedy the error asks for; disabling it
      #    with `ELECTRON_DISABLE_SANDBOX` would also work and would turn off a security boundary
      #    to run a checker over our own fixtures, which is the wrong trade even on a throwaway
      #    runner.
      # 2. A display. The runner has no X server, and Electron on Linux needs one even for a window
      #    it never shows, so the test runs under Xvfb.
      - name: let Ace's Electron start on a headless runner
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          sandbox="$(npm root -g)/@daisy/ace/node_modules/electron/dist/chrome-sandbox"
          ls -l "$sandbox"
          sudo chown root:root "$sandbox"
          sudo chmod 4755 "$sandbox"
          ls -l "$sandbox"
      - run: cargo run -p xtask -- vendor-pdfium
      - run: cargo run -p xtask -- fixtures
      - run: xvfb-run -a cargo nextest run -p openconvert --features ace --locked -E 'test(ace_zero_serious_violations)'
