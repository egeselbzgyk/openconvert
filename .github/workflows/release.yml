name: release
# PHASE 15: build, sign, verify and publish OpenConvert from a `v*.*.*` tag, as a draft release a
# maintainer then publishes. Every gate the plan names for a release runs here, and every step that
# checks one carries the plan's row number and test name, so a failure reads as the rule it broke.
#
# docs/RELEASE_CHECKLIST.md is the human side of this file: what it cannot check, and what to do
# when it fails. docs/VERSIONING.md is what `bump-rules-check` enforces.
#
# Platforms: v1.0.0 ships for Windows and Linux only (maintainer decision 2026-09-23; D12
# amendment). macOS comes in a later 1.x, once there is an Apple Developer ID: its legs — the
# bundle, `packaging/macos/sign_nested.sh` and `notarize.sh`, rows 15.1–15.4 and the macOS
# reproducibility table — come back into this file then. The scripts stay in `packaging/macos/`.
#
# Secrets (a missing one fails the job that needs it, by name, before anything is built):
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD     every OS (updater signatures)
# Windows installers are unsigned in v1 and say so (D12); nothing here signs them with Authenticode.
#
# D1: the release needs no Python. The jobs that decide what ships and build the engine run in a
# Debian container with none installed and assert it (row 15.14); the Windows runner image ships a
# Python this workflow never calls. The Linux build's GTK/WebKit -dev packages do pull Python in
# (GLib's code generators, which this build never runs), so that job diverts every Python
# interpreter out of reach once they are installed and then asserts none is left: a step that
# called Python would fail, so the build shows it needs none (DECISIONS_LOG 2026-09-23).
#
# Shell note: the Linux `run`s, and every `shell: bash` one, are `bash -e`, where `x=$(false)` ends
# the step (the first tag run, 2026-09-23). A test that may be false is therefore never the last
# command of a command substitution, nor of a step: `exe=""; if [ … ]; then exe=.exe; fi`.
on:
  push: { tags: ["v*.*.*"] }
  workflow_dispatch:
    inputs:
      tag: { description: "The existing tag to release", required: true }
permissions: { contents: write }
concurrency: { group: "release-${{ github.ref }}", cancel-in-progress: false }
env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  TAURI_CLI_VERSION: "2.11.5"

jobs:
  # What must hold before anything is built.
  gates:
    runs-on: ubuntu-24.04
    container: rust:1.98.1-slim-bookworm
    steps:
      - name: "row 15.14 release_job_needs_no_python: this image has no Python"
        run: |
          if command -v python3 || command -v python; then echo "::error::Python is on the release image"; exit 1; fi
      # `file` for sign_nested_signs_every_macho_inside_out: packaging/macos/sign_nested.sh finds the
      # Mach-O files to sign with it, and the slim image has none (v1.0.0's first tag run, 2026-09-23).
      - run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates file
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      # Row 15.18: no TODO_ in models.toml, packs.toml, thresholds.toml or the updater key, and no
      # lapsed review_by. Clean since 2026-09-23, when the maintainer's updater public key went into
      # tauri.conf.json (docs/RELEASE_CHECKLIST.md, "Keys and signing").
      - name: "row 15.18 no_todo_placeholders_on_a_release_tag"
        run: cargo run -p xtask --locked -- ci-lint --release-branch
      - run: cargo run -p xtask --locked -- thresholds-lint
      # Rows 15.16, 15.17: an IR, protocol, prompt or job-spec change without its bump fails, and
      # the tag must be the version the tree declares.
      - name: "rows 15.16/15.17 bump rules"
        run: cargo run -p xtask --locked -- bump-rules-check --tag "$TAG"
      # The unit halves of the release rows: 15.5, 15.8, 15.14, 15.16–15.18, the SBOM and
      # reproducibility logic, and the bundle layout.
      - run: cargo test -p xtask --locked --test release

  build:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-22.04, os: linux, target: x86_64-unknown-linux-gnu, bundles: appimage,
              container: "debian:bookworm" }
          - { runner: windows-latest, os: windows, target: x86_64-pc-windows-msvc, bundles: "nsis,msi" }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    env:
      BUNDLE: target/${{ matrix.target }}/release/bundle
    steps:
      # Row 15.14 on the Linux build image: the -dev packages bring /usr/bin/python3 (the first tag
      # run, 2026-09-23). `dpkg-divert --rename` moves each interpreter, under dpkg's own record, to
      # a directory off PATH; the assertion then holds for the rest of the job.
      - name: "row 15.14 release_job_needs_no_python: Linux build image, Python diverted out of reach"
        if: matrix.os == 'linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git curl ca-certificates build-essential pkg-config \
            file jq xdg-utils xvfb xauth libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
          mkdir -p /usr/lib/oc-diverted
          for exe in /usr/bin/python* /usr/local/bin/python*; do if [ -e "$exe" ] || [ -L "$exe" ]; then dpkg-divert --local --rename --divert "/usr/lib/oc-diverted/${exe##*/}" --add "$exe"; fi; done
          if command -v python3 || command -v python; then echo "::error::Python is on the release image"; exit 1; fi
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - name: every secret this platform signs with is present
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          need() { if [ -z "${!1}" ]; then echo "::error::secret $1 is not set"; exit 1; fi; }
          need TAURI_SIGNING_PRIVATE_KEY
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1, targets: "${{ matrix.target }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix apps/desktop/ui
      - run: cargo run -p xtask --locked -- vendor-pdfium
      - run: cargo run -p xtask --locked -- fetch-llama-server
      - run: cargo build -p openconvert --release --locked --target ${{ matrix.target }}
      - name: stage the sidecars
        shell: bash
        run: |
          exe=""
          if [ "${{ matrix.os }}" = windows ]; then exe=.exe; fi
          mkdir -p target/release
          cp "target/${{ matrix.target }}/release/openconvert$exe" target/release/
          cargo run -p xtask --locked -- stage-sidecars --release
      - run: cargo install tauri-cli --version "=${{ env.TAURI_CLI_VERSION }}" --locked

      # The bundler signs the updater payload, which on Linux and Windows is the installer itself.
      - name: bundle
        shell: bash
        working-directory: apps/desktop/src-tauri
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: cargo tauri build --target ${{ matrix.target }} --bundles "${{ matrix.bundles }}"

      - name: "row 15.6 windows_installers_are_produced_and_hashed"
        if: matrix.os == 'windows'
        shell: bash
        run: OC_BUNDLE_DIR="$PWD/$BUNDLE" cargo test -p xtask --locked --features release-artifacts --test release -- --exact windows_installers_are_produced_and_hashed
      - name: "row 15.7 appimage_launches_and_converts_headless"
        if: matrix.os == 'linux'
        run: |
          cargo run -p xtask --locked -- fixtures
          OC_BUNDLE_DIR="$PWD/$BUNDLE" cargo test -p xtask --locked --features release-artifacts --test release -- appimage_
      - name: "row 15.15 installer_size_within_budget"
        shell: bash
        run: OC_BUNDLE_DIR="$PWD/$BUNDLE" cargo test -p xtask --locked --features release-artifacts --test release -- --exact installer_size_within_budget
      - name: release manifest (every artefact and its SHA-256)
        shell: bash
        run: |
          cargo run -p xtask --locked -- release manifest --os ${{ matrix.os }} --bundle-dir "$BUNDLE" \
            --out "manifest-${{ matrix.target }}.json"
          mkdir -p out
          cp "manifest-${{ matrix.target }}.json" out/
          # jq.exe on the Windows runner ends each line with CRLF; the `\r` would make every name
          # match nothing and the installers would silently stay behind. A name not copied fails.
          jq -r '.files[].name' "manifest-${{ matrix.target }}.json" | tr -d '\r' | while IFS= read -r name; do
            find "$BUNDLE" -maxdepth 2 -type f -name "$name" -exec cp {} out/ \;
            if [ ! -f "out/$name" ]; then echo "::error::$name is in the manifest but was not found under $BUNDLE"; exit 1; fi
          done
      - uses: actions/upload-artifact@v4
        with: { name: "release-${{ matrix.target }}", path: out/ }

  # Row 15.13 (D13.8, A15.3): the fast corpus converted --no-ai on every OS the release ships
  # (Linux and Windows in 1.0; ci.yml still builds and tests on macOS on every push to main).
  repro:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, os: linux, container: "rust:1.98.1-slim-bookworm" }
          - { runner: windows-latest, os: windows }
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    steps:
      - if: matrix.os == 'linux'
        run: |
          apt-get update && apt-get install -y --no-install-recommends git curl ca-certificates
          if command -v python3 || command -v python; then echo "::error::Python is on the release image"; exit 1; fi
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: dtolnay/rust-toolchain@master
        with: { toolchain: 1.98.1 }
      - run: cargo run -p xtask --locked -- vendor-pdfium
      - run: cargo run -p xtask --locked -- fixtures
      - run: cargo build -p openconvert --release --locked
      - shell: bash
        run: |
          exe=""
          if [ "${{ matrix.os }}" = windows ]; then exe=.exe; fi
          engine="target/release/openconvert$exe"
          cargo run -p xtask --locked -- repro hash --engine "$PWD/$engine" --os ${{ matrix.os }} \
            --out repro/${{ matrix.os }}.json --epubs repro/${{ matrix.os }}
      - uses: actions/upload-artifact@v4
        with: { name: "repro-${{ matrix.os }}", path: repro/ }

  repro-compare:
    needs: repro
    runs-on: ubuntu-24.04
    container: rust:1.98.1-slim-bookworm
    steps:
      - run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          if command -v python3 || command -v python; then echo "::error::Python is on the release image"; exit 1; fi
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: "repro-*", path: repro, merge-multiple: true }
      - name: "row 15.13 reproducible_no_ai_output_across_os"
        run: OC_REPRO_DIR="$PWD/repro" cargo test -p xtask --locked --features release-artifacts --test release -- --exact reproducible_no_ai_output_across_os

  # Rows 15.11, 15.12: one CycloneDX 1.6 SBOM, validated offline, every vendored native in it.
  sbom:
    needs: gates
    runs-on: ubuntu-24.04
    container: rust:1.98.1-slim-bookworm
    steps:
      - run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates
          if command -v python3 || command -v python; then echo "::error::Python is on the release image"; exit 1; fi
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --prefix apps/desktop/ui
      - run: cargo install cargo-cyclonedx --version "=0.5.9" --locked
      - run: cargo run -p xtask --locked -- sbom --out "out/openconvert-${TAG#v}.cdx.json"
      - name: "rows 15.11 sbom_is_valid_cyclonedx_1_6, 15.12 sbom_lists_every_vendored_native"
        run: OC_SBOM="$PWD/out/openconvert-${TAG#v}.cdx.json" cargo test -p xtask --locked --features release-artifacts --test release -- sbom_
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: out/ }

  # Row 15.8's other half: the Flathub manifest passes Flathub's own linter. Flathub builds it.
  flatpak-lint:
    needs: gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - run: |
          docker run --rm -v "$PWD:/src" -w /src ghcr.io/flathub/flatpak-builder-lint:latest \
            manifest packaging/linux/flatpak/io.github.egeselbzgyk.OpenConvert.yml

  publish:
    needs: [build, repro-compare, sbom, flatpak-lint]
    runs-on: ubuntu-24.04
    container: rust:1.98.1-slim-bookworm
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - run: |
          apt-get update && apt-get install -y --no-install-recommends git ca-certificates gh jq
          if command -v python3 || command -v python; then echo "::error::Python is on the release image"; exit 1; fi
      - uses: actions/checkout@v4
        with: { ref: "${{ env.TAG }}" }
      - uses: actions/download-artifact@v4
        with: { pattern: "release-*", path: assets, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { name: sbom, path: assets }
      - name: the updater manifest (latest.json)
        run: |
          # The `## [X.Y.Z]` section of docs/CHANGELOG.md; refused when missing, empty, or still
          # carrying a TODO_ placeholder (the 1.0.0 draft's, for Phase 14's security claims).
          cargo run -p xtask --locked -- release changelog --version "$TAG" --out notes.md
          cargo run -p xtask --locked -- release latest-json --dir assets --version "$TAG" --notes notes.md \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --base-url "https://github.com/${GH_REPO}/releases/download/${TAG}" --out assets/latest.json
      - name: "row 15.9 on the release key: every latest.json entry verifies"
        run: cargo run -p xtask --locked -- release verify-latest --latest assets/latest.json --assets assets
      - name: release body with every artefact's SHA-256 (row 15.20)
        run: |
          { cat notes.md; echo; echo "Windows installers are not code-signed in this release (D12): see docs/INSTALL.md."; echo;
            cargo run -q -p xtask --locked -- release hash-dir --dir assets; } > body.md
      - run: gh release create "$TAG" --draft --verify-tag --title "OpenConvert ${TAG}" --notes-file body.md assets/*
      - name: "row 15.20 release_artifacts_all_have_published_hashes"
        run: |
          gh release download "$TAG" --dir published
          gh release view "$TAG" --json body --jq .body > published-body.md
          OC_RELEASE_BODY="$PWD/published-body.md" OC_RELEASE_ASSETS="$PWD/published" \
            cargo test -p xtask --locked --features release-artifacts --test release -- --exact release_artifacts_all_have_published_hashes
