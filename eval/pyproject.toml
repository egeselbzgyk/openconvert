[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oc-eval"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "pypdfium2>=4",       # rendering + reference text extraction (BSD/Apache, matches our backend)
  "pdfplumber>=0.11",   # MIT, word boxes for cross-checking (pdfminer.six under the hood)
  "pikepdf>=9",         # qpdf bindings (Apache-2.0) for structural mutation + QDF round-trip
  "jiwer>=3",           # CER/WER (R7 §B.5)
  "numpy>=2",
  "pandas>=2",
  "pillow>=11",         # scan simulation + fixture PNG authoring
  "img2pdf>=0.6",       # image-only PDF wrapping (R7 §C.2 step 3)
  "lxml>=5",            # XHTML ground truth from Standard Ebooks
  "matplotlib>=3.9",    # reliability diagrams (R9 §C.9)
  "scipy>=1.14",        # McNemar exact binomial (R9 §C.7)
  "typer>=0.15",
  "psutil>=6",        # whole-process-tree peak RSS (R9 §D.5); BSD-3-Clause
]

[project.optional-dependencies]
render = ["weasyprint>=63"]     # optional: second synthetic renderer (R7 §B.1)
dev     = ["pytest>=8", "syrupy>=4", "hypothesis>=6", "ruff>=0.9", "mypy>=1.14", "lxml-stubs>=0.5", "types-psutil>=6", "pyyaml>=6", "types-pyyaml>=6"]

[project.scripts]
oc-eval = "oc_eval.__main__:app"

[tool.ruff]
line-length = 100

# Selected explicitly rather than left to ruff's defaults: the default set moves between
# releases, and a lint that changes under you is one nobody trusts. `S` (flake8-bandit) is
# on because this package is the only place in the repository allowed to open a URL, and
# every one of those call sites should have to say so.
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "RUF"]
ignore = [
  "S101",  # assert: this is a test-heavy package and pytest is built on it
  "B008",  # typer declares CLI options as argument defaults; that is its API
  "S311",  # every `random` here is a seeded fixture generator, never a secret
  # Ambiguous-character rules, off for a project whose subject is Turkish and German text:
  # the dotless i and the right single quotation mark are the data, not a typo.
  "RUF001",
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]

[tool.hatch.build.targets.wheel]
packages = ["src/oc_eval"]
