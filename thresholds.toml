[layout.columns.gutter_min_width_em]
value = 0.5
source = "provisional"
evidence = "PIPELINE §6 step 2 asks for a gutter at least 1.5 x the modal word space. The modal word space is a `text`-stage quantity measured over glyph advances and is not carried on a `Line`, so the bar is expressed in ems, estimated as the page's median line-box height: a word space is 0.25-0.33 em in most book faces, so 1.5 of them is 0.4-0.5 em, and the higher end is taken because a false gutter interleaves two columns while a missed one only costs the column split. Revisit when the word-space statistic is carried forward."
owner = "maintainer"
review_by = "2027-06-30"

[layout.columns.gutter_emptiness_min]
value = 0.98
source = "provisional"
evidence = "PIPELINE §6 step 2, marked provisional there. The fraction of a candidate gutter that must be free of ink within the vertical span that qualifies it. Not 1.0, so that a descender or a single crossing rule does not destroy a gutter that is otherwise clean for the height of the page."
owner = "maintainer"
review_by = "2027-06-30"

[layout.columns.gutter_height_share_min]
value = 0.6
source = "provisional"
evidence = "PIPELINE §6 step 2, marked provisional there. How much of the text height the qualifying span must cover. Below the whole height on purpose: a full-width floating title crosses the gutter near the top of the page, and a criterion measured over the whole height would lose the gutter to it - which is the very configuration pre-masking exists for."
owner = "maintainer"
review_by = "2027-06-30"

[layout.columns.continuity_break_max]
value = 0.30
source = "provisional"
evidence = "PIPELINE §6 step 4, marked provisional there: if the text fails to run on across more than this share of page boundaries, the column hypothesis is suspect and the page set is laid out again with one column fewer. A rate, never a single boundary - most pages of a novel end mid-sentence, but a chapter end does not, and a document of four pages has three samples."
owner = "maintainer"
review_by = "2027-06-30"

[layout.columns.max_column_retries]
value = 2
source = "provisional"
evidence = "PIPELINE §6 step 4: 'Bounded to two retries, then accept and warn.' The bound matters more than the number - a search that keeps narrowing eventually reaches one column, which reads every page top to bottom and is never wrong-looking enough to stop itself."
owner = "maintainer"
review_by = "2027-06-30"

[layout.block.agreement_iou_min]
value = 0.8
source = "provisional"
evidence = "IMPLEMENTATION_PLAN Phase 3 detail 1: block-boundary IoU < 0.8 between Docstrum and the whitespace cover flags the block low-confidence. The number is the plan's, not a published one; it is a disagreement alarm rather than a decision, so it is cheap to move once the Phase 7 corpus says how often it fires per producer stratum."
owner = "maintainer"
review_by = "2027-06-30"

[layout.block.separator_height_ratio]
value = 0.5
source = "provisional"
evidence = "A maximal white rectangle separates two lines only if it is at least this fraction of the page's median line height thick. The band between two lines of one paragraph is the leading minus the line height - a couple of points at book settings - while a paragraph or heading break is half a line or more. Measured against the *obstacle* sizes, deliberately: Docstrum already reads the distance distribution, and a cross-check that read the same statistic would not be one. Matches pdfminer's line_margin of 0.5 x line height in magnitude (R2 §B.6) without being the same measurement."
owner = "maintainer"
review_by = "2027-06-30"

[dehyphen.classifier_margin_min]
value = 0.25
source = "provisional"
evidence = "How far from zero the classifier's log-odds have to be before its verdict is used at all. A quarter of a logit is a probability between 0.44 and 0.56 - a coin toss - and a coin toss keeps the hyphen, because a spurious hyphen is visible and a wrong join is silent (PIPELINE §7, RT C4). The number trades join-recall for keep-recall at the margin only; the shipped model's holdout keep-recall is measured through this rule rather than on the raw sign."
owner = "maintainer"
review_by = "2027-06-30"

