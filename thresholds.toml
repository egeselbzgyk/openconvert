[words.gap_separation_ratio_min]
value = 2.0
source = "provisional"
evidence = "IMPLEMENTATION_PLAN Phase 2 detail 2 / R10 §6.2: below this the gap distribution is not bimodal and the 2-means fit is rejected in favour of the metric space width"
owner = "maintainer"
review_by = "2027-06-30"

[words.gap_resolution_pt]
value = 0.05
source = "provisional"
evidence = "The floor on the within-cluster spread in the 2-means separation test, and the smallest centroid distance worth believing. PDFium reports glyph geometry to about 0.01 pt, and no typographic distinction is made at a twentieth of a point, so two gap clusters closer than this are one cluster and the fit must be rejected however tight they are"
owner = "maintainer"
review_by = "2027-06-30"

[words.min_space_ratio]
value = 0.15
source = "provisional"
evidence = "The floor under an inferred space, as a fraction of font size. 2-means always finds two clusters, so on a page whose real spaces are drawn as space glyphs the only gaps left to fit are intra-word kerning, and a fit over those produces a threshold of a fraction of a point that splits every word - measured on f01, which came out as 'except at o ccasional inter vals'. A word space is never narrower than this: the narrowest base-14 space is Times' 0.25 em and justification compresses it to perhaps 0.6 of that, while intra-word kerning on f01 runs at 0.05 em"
owner = "maintainer"
review_by = "2027-06-30"

[words.fallback_space_ratio]
value = 0.25
source = "provisional"
evidence = "PIPELINE §4 step 3 says 'fall back to the font-metric default space width'; FontInfo carries no metrics, so this is the space width of the base-14 proportional faces (Times 0.250 em, Helvetica 0.278 em) at its low end - the conservative choice, since too small a threshold splits words and too large a one merges them. Replace with the font's own /Widths entry for the space glyph when oc-pdf exposes it"
owner = "maintainer"
review_by = "2027-06-30"

[text.line_baseline_tolerance_ratio]
value = 0.30
source = "published"
evidence = "R2 §B.3 / R10 §6.2 / PIPELINE §4 step 1: cluster glyphs by baseline y with a tolerance of 0.3 x font size, a fraction rather than an absolute because superscripts pull the baseline"
owner = "maintainer"
review_by = "2028-01-01"

[text.line_split_gap_em]
value = 1.2
source = "provisional"
evidence = "A horizontal gap this wide, in ems of the glyph before it, is not a word space: it is two columns, or two table cells, and a *run* is broken there. Not a line: where the columns are is `layout`'s to say, from the x-projection of these run boxes, and the lines are split at the gutters that projection finds. What this number buys is that the boxes being projected do not themselves span a gutter. A word space is 0.25-0.33 em by design and justification stretches it to at most about 1 em before a typesetter rebreaks the line; a column gutter is 2 em or more (Typst's default is 4 % of the measure, which is 2.0 em on f02; book practice is a pica or wider, 1.2 em at 10 pt). The floor is set at the narrow end of gutter practice rather than the wide end of word spacing, because merging two columns interleaves two arguments while splitting a wide space costs a line boundary that `paragraphs` puts back."
owner = "maintainer"
review_by = "2027-06-30"

