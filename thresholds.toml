evidence = "PIPELINE §7 step 4: Calibre's `pdf_input` unwrap_factor, the PDF-path value and the anchored default here. R10 §6.4's 0.4 is the generic HTML path's; IMPLEMENTATION_PLAN Phase 3 detail 4 quotes that one, and PIPELINE outranks it (docs/DECISIONS_LOG.md 2026-09-13). A line reaching less than this share of its block's measure ended its paragraph."
owner = "maintainer"
