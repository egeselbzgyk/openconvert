[paragraph.indent_convention_min_share]
value = 0.05
source = "provisional"
evidence = "The share of a book's lines that have to be indented before the book is read as using first-line indentation. A book that indents averages one indented line per paragraph over four to eight lines of paragraph, so 0.12-0.25; a book that separates paragraphs with space indents almost nothing, and what it does indent - block quotes, verse - is well under 0.05. The gap between the two populations is an order of magnitude, which is why the exact figure does not matter much; what matters is that the decision is made once over the whole book, because a book is internally consistent and a page is not enough evidence (PIPELINE §7 step 1, R1 §C.4 #3)."
owner = "maintainer"
review_by = "2027-06-30"

