# Optional packs (D6, LICENSE_AND_DEPENDENCIES §6): post-install, SHA-256-pinned, licence-labelled
# downloads, never fetched during a conversion, installed by the same downloader as a model
# (`oc_net::packs`, IMPLEMENTATION_PLAN Phase 12 detail 9).
#
# A `[[pack]]` works as in models.toml: `revision` is a 40-hex commit, `sha256` is checked while the
# file streams, and an unfilled placeholder anywhere refuses the whole file. A `[[deferred]]` pack is
# named but not offered in this version: it has no pin fields (any is refused), the app's Packs
# screen says it arrives later, and nothing downloads it. The OCR pack is not listed: v1 uses the
# system's Tesseract (D4).
schema_version = 1

# Deferred past v1.0 (maintainer decision 2026-09-23; D6 amendment, docs/DECISIONS_LOG.md): the pack
# is not built, and the licence of the Java runtime it would bundle (GPL-2.0 with the Classpath
# Exception for an OpenJDK build such as Temurin) has not been verified for a chosen vendor (VD-f).
# When it comes, it moves to a `[[pack]]` with every pin filled, its runtime's licence text bundled
# beside Apache-2.0's (LICENSE_AND_DEPENDENCIES §6, §9 note 1), and its host on the downloader's
# allowlist. The built-in Tier-1 validator runs on every conversion either way.
[[deferred]]
id           = "validation"
display_name = "Validation pack"
contents     = "EPUBCheck with a minimal Java runtime"
reason       = "OpenConvert 1.0 does not offer the validation pack; it arrives in a later release. The built-in validator checks every EPUB it writes."
