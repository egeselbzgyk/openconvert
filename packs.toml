# Optional packs (D6, LICENSE_AND_DEPENDENCIES §6): post-install, SHA-256-pinned, licence-labelled
# downloads, never fetched during a conversion, installed by the same downloader as a model
# (`oc_net::packs`, IMPLEMENTATION_PLAN Phase 12 detail 9).
#
# Every field works as in models.toml: `revision` is a 40-hex commit, `sha256` is checked while the
# file streams, and a `TODO_` placeholder anywhere makes the app say "not available in this
# version" for every pack. The OCR pack is not listed: v1 uses the system's Tesseract (D4).
schema_version = 1

[[pack]]
id           = "validation"
display_name = "Validation pack"
contents     = "EPUBCheck with a minimal Java runtime"
# EPUBCheck is BSD-3-Clause; the jlink'd runtime's licence (GPL-2.0 with the Classpath Exception
# for an OpenJDK build such as Temurin) must be verified for the vendor chosen before this is
# filled in, and its text bundled beside Apache-2.0's (LICENSE_AND_DEPENDENCIES §6, §9 note 1).
license      = "TODO_LICENSE"
# The pack is built and published by the project; where is not decided yet. The host must be on
# the downloader's allowlist, which today names only the model host.
repo         = "TODO_REPO"
revision     = "TODO_COMMIT_SHA"
file         = "TODO_FILE"
sha256       = "TODO_SHA256"
size_bytes   = 0
