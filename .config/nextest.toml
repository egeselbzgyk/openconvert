# IMPLEMENTATION_PLAN.md §0.5. Retries are banned: a flaky test is a bug.

[profile.default]
fail-fast = false
retries = 0
status-level = "fail"

[profile.ci]
fail-fast = false
retries = 0
failure-output = "immediate-final"
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"
