[workspace]
resolver = "2"
members = [
  "crates/oc-model", "crates/oc-pdf", "crates/oc-text", "crates/oc-layout",
  "crates/oc-structure", "crates/oc-epub", "crates/oc-validate", "crates/oc-ai",
  "crates/oc-net", "crates/oc-core", "crates/oc-testkit", "crates/openconvert",
  "apps/desktop/src-tauri", "xtask",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
rust-version = "1.98"
license      = "Apache-2.0"
repository   = "https://github.com/openconvert/openconvert"

[workspace.dependencies]
# --- core data ---
serde        = { version = "1", features = ["derive"] }
serde_json   = { version = "1", features = ["preserve_order"] }
toml         = "0.9"
blake3       = "1"
sha2         = "0.10"
base32       = "0.5"
indexmap     = { version = "2", features = ["serde"] }
smallvec     = "1"
compact_str  = { version = "0.9", features = ["serde"] }
thiserror    = "2"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# --- pdf ---
pdfium-render = { version = "0.9.4", default-features = false, features = ["pdfium_7881", "image_025", "thread_safe"] }
# NOTE: the plan's feature names ("image", "libloading") do not exist in 0.9.4. `libloading` is an
# unconditional non-wasm dependency, so runtime binding (D3) needs no feature; the image API is
# `image_025` (matching our `image` 0.25 pin). The PDFium build is pinned exactly rather than via
# `pdfium_latest`, so the bindings and the vendored library cannot drift; `xtask vendor-pdfium`
# refuses to run when this feature and `xtask/pdfium.lock` disagree. See docs/DECISIONS_LOG.md.
lopdf         = { version = "0.45", default-features = false, features = ["serde"] }
# --- text ---
unicode-normalization = "0.1"
unicode-properties    = "0.1"
whatlang              = "0.18"
# `hyphenation` is deliberately absent. VD-b closed 2026-09-13: the crate ships its
# `hyph-utf8` pattern files stripped of their licence headers and disclaims them
# ("patterns © their respective owners"), and Turkish is LPPL-1.0+ upstream, which D15
# does not allow. v1 needs no Knuth-Liang patterns at all - dehyphenation is the four
# tiers plus the committed classifier. `deny.toml` bans the crate so the decision holds.
# See docs/DECISIONS_LOG.md.
regex                 = "1"
# --- epub ---
# VD-a closed 2026-09-09: zip 8.6.0 is the current stable major (9.0.0 exists only as -preN).
# See docs/DECISIONS_LOG.md.
quick-xml = { version = "0.42", features = ["serialize"] }
zip       = { version = "8.6", default-features = false, features = ["deflate"] }
image     = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
uuid      = { version = "1", features = ["v5"] }
time      = { version = "0.3", features = ["formatting", "macros"] }
# --- desktop shell (apps/desktop only) ---
tauri              = { version = "2", features = [] }
tauri-build        = "2"
# Native file picker and save dialog, and "open with the default app" / "show in folder". Both
# are called from the app's own Rust commands; the webview is granted neither plugin (test 12.13).
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# --- parallelism / process ---
rayon = "1"
# --- net (oc-net only) ---
ureq = { version = "3", features = ["rustls"] }
# --- fixtures (xtask only; never shipped) ---
# Typst-sourced fixtures are compiled in-process so regeneration needs no external tool
# (DECISIONS.md Appendix A, TEST_CORPUS 6.1). Pinned exactly: a Typst bump changes fixture
# bytes and must be a reviewed commit that regenerates them and reviews the snapshot diff.
typst        = "=0.15.1"
typst-pdf    = "=0.15.1"
# `PagedDocument` - what `typst::compile` produces and `typst_pdf::pdf` consumes - lives here
# and is not re-exported by the `typst` facade.
typst-layout = "=0.15.1"
typst-assets = { version = "=0.15.1", features = ["fonts"] }
# --- dev ---
insta     = { version = "1.48", features = ["json", "redactions", "filters"] }
proptest  = "1.11"
criterion = { version = "0.8", features = ["html_reports"] }
pdf-writer = "0.13"
trybuild  = "1.0"

# Debug info is the bulk of a test binary, and this workspace links a great many of them: every
# integration test statically links the whole pipeline, including the PDFium binding, so
# `openconvert` alone contributes twenty such executables. Phase 6 added eight more and the Ubuntu
# CI runner ran out of disk while linking them — `collect2: fatal error: ld terminated with signal 7
# [Bus error]` is what a full filesystem looks like from inside the linker (CI 35398970632, the
# `test (ubuntu-latest)` and `no-network` jobs).
#
# `line-tables-only` keeps the file and line of every frame, which is all a panic backtrace in CI
# needs in order to name the assertion that failed, and drops the type and variable descriptions
# that make up most of the size. `release` and `bench` are deliberately untouched: `bench` wants
# full symbols for profiling, and `release` already strips.
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"

[profile.bench]
inherits = "release"
debug = true
