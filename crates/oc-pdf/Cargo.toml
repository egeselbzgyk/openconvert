[package]
name         = "oc-pdf"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "PdfBackend trait, PDFium implementation, lopdf object access, page classification"
publish      = false

[dependencies]
oc-model = { path = "../oc-model", version = "1.0.0" }
oc-core = { path = "../oc-core", version = "1.0.0" }
pdfium-render.workspace = true
lopdf.workspace = true
flate2.workspace = true
weezl.workspace = true
quick-xml.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# The grayscale raster OCR reads (PHASE 13 detail 3). Already `pdfium-render`'s `image_025` dependency.
image.workspace = true
tracing.workspace = true
thiserror.workspace = true

[features]
# The differential test against `pdftotext` (test 1.18). Off by default: Poppler and Xpdf
# are GPL and never ship (D15), and the binary is not present on most machines. The
# `poppler-oracle` CI job turns it on, which is the gate CLAUDE.md asks for in place of
# `#[ignore]`.
poppler-oracle = []

[dev-dependencies]
oc-testkit = { path = "../oc-testkit", version = "1.0.0" }
insta.workspace = true
proptest.workspace = true
pdf-writer.workspace = true
unicode-normalization.workspace = true
