[package]
name         = "openconvert"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "OpenConvert CLI: the engine's face (D13.1)"
publish      = false

[features]
default = []
# Row 5.17: EPUBCheck needs a JVM and a jar, so the gate is behind a feature rather than
# an ignore attribute — CI turns a feature on and a developer can too, while an ignored test
# is one nobody ever runs again.
epubcheck = []
# Tier 3: Ace by DAISY is a Node application, gated for the same reason and turned on by the
# nightly `ace-a11y` job.
ace = []
# PHASE 7 rows 7.11 and 7.12: the wall-clock budget assertions. Gated because a timing
# assertion on a shared CI runner measures the runner, and a gate that fails for that
# reason is one people learn to re-run until it passes. The nightly `bench` job turns it on.
bench = []
# PHASE 14 row 14.16: the Isartor suite is fetched (`cargo run -p xtask -- fetch-isartor`, pinned,
# never committed) into `target/isartor/`, so the test is gated on the job that fetches it. On,
# with nothing fetched, it fails.
isartor = []
# PHASE 10: `convert --ai --ai-all-tasks` against a real llama-server and model (`OC_LLAMA_SERVER`,
# `OC_LIVE_MODEL`). Gated like `oc-testkit`'s live tests, and run by the same nightly job.
live-llm = []
# PHASE 13: A13.1, rows 13.20 and 13.21 need a real system Tesseract 5 with `eng`, `deu` and
# `tur`. Gated so that a machine without one runs the ordinary suite green; the `ocr` CI job
# installs Tesseract and turns it on, and with the feature on a missing engine fails the tests.
tesseract = []

[lib]
name = "openconvert"
path = "src/lib.rs"

[[bin]]
name = "openconvert"
path = "src/main.rs"

[dependencies]
oc-core = { path = "../oc-core", version = "1.0.0" }
oc-model = { path = "../oc-model", version = "1.0.0" }
oc-layout = { path = "../oc-layout", version = "1.0.0" }
oc-pdf = { path = "../oc-pdf", version = "1.0.0" }
oc-structure = { path = "../oc-structure", version = "1.0.0" }
oc-epub = { path = "../oc-epub", version = "1.0.0" }
oc-validate = { path = "../oc-validate", version = "1.0.0" }
oc-text = { path = "../oc-text", version = "1.0.0" }
oc-net = { path = "../oc-net", version = "1.0.0" }
# The AI step drives the four tasks (PHASE 10). `oc-ai` opens no socket; `oc-net` is the transport.
oc-ai = { path = "../oc-ai", version = "1.0.0" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# An API key read from `--llm-api-key-file`, handed to `oc-net` without ever being a plain string.
secrecy.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
zip.workspace = true
oc-testkit = { path = "../oc-testkit", version = "1.0.0" }
insta.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "stages"
harness = false
