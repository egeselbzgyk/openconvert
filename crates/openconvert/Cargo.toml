[package]
name         = "openconvert"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "OpenConvert CLI: the engine's face (D13.1)"
publish      = false

[lib]
name = "openconvert"
path = "src/lib.rs"

[[bin]]
name = "openconvert"
path = "src/main.rs"

[dependencies]
oc-core = { path = "../oc-core", version = "0.1.0" }
oc-model = { path = "../oc-model", version = "0.1.0" }
oc-layout = { path = "../oc-layout", version = "0.1.0" }
oc-pdf = { path = "../oc-pdf", version = "0.1.0" }
oc-structure = { path = "../oc-structure", version = "0.1.0" }
oc-text = { path = "../oc-text", version = "0.1.0" }
oc-net = { path = "../oc-net", version = "0.1.0" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
oc-testkit = { path = "../oc-testkit", version = "0.1.0" }
insta.workspace = true
proptest.workspace = true
