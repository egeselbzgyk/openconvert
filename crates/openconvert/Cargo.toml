[package]
name         = "openconvert"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "OpenConvert CLI: the engine's face (D13.1)"
publish      = false

[features]
default = []
# Row 5.17: EPUBCheck needs a JVM and a jar, so the gate is behind a feature rather than
# an ignore attribute — CI turns a feature on and a developer can too, while an ignored test
# is one nobody ever runs again.
epubcheck = []
# Tier 3: Ace by DAISY is a Node application, gated for the same reason and turned on by the
# nightly `ace-a11y` job.
ace = []
# PHASE 7 rows 7.11 and 7.12: the wall-clock budget assertions. Gated because a timing
# assertion on a shared CI runner measures the runner, and a gate that fails for that
# reason is one people learn to re-run until it passes. The nightly `bench` job turns it on.
bench = []
# PHASE 13: A13.1, rows 13.20 and 13.21 need a real system Tesseract 5 with `eng`, `deu` and
# `tur`. Gated so that a machine without one runs the ordinary suite green; the `ocr` CI job
# installs Tesseract and turns it on, and with the feature on a missing engine fails the tests.
tesseract = []

[lib]
name = "openconvert"
path = "src/lib.rs"

[[bin]]
name = "openconvert"
path = "src/main.rs"

[dependencies]
oc-core = { path = "../oc-core", version = "0.1.0" }
oc-model = { path = "../oc-model", version = "0.1.0" }
oc-layout = { path = "../oc-layout", version = "0.1.0" }
oc-pdf = { path = "../oc-pdf", version = "0.1.0" }
oc-structure = { path = "../oc-structure", version = "0.1.0" }
oc-epub = { path = "../oc-epub", version = "0.1.0" }
oc-validate = { path = "../oc-validate", version = "0.1.0" }
oc-text = { path = "../oc-text", version = "0.1.0" }
oc-net = { path = "../oc-net", version = "0.1.0" }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
zip.workspace = true
oc-testkit = { path = "../oc-testkit", version = "0.1.0" }
insta.workspace = true
proptest.workspace = true
criterion.workspace = true

[[bench]]
name = "end_to_end"
harness = false

[[bench]]
name = "stages"
harness = false
