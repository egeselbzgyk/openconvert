W_SECTION_PAGES_NOT_MONOTONE = "Abschnitt {section} umfasst Seiten, die rückwärts laufen oder einen anderen Abschnitt überlappen ({starts}). Die Kapitelgrenzen können falsch sein."
W_STYLE_INVENTORY_INVALID = "Die Überschriftenerkennung über Textstile war hier nicht brauchbar — {clusters} Stilgruppen, die {body_char_share} des Textes abdecken — daher wurden Überschriften allein über die Schriftgröße gefunden."
W_TABLE_AS_IMAGE = "Eine Tabelle mit {rows}×{columns} Zellen wurde als Bild mit ihrem Text darunter ausgegeben, weil ihre Struktur nicht rekonstruierbar war ({reason})."
W_UNMAPPED_VALIDATION_ID = "Der Validator meldete {message_id}, wofür dieser Konverter keine Reparatur kennt. Die Meldung wird wörtlich aufgezeichnet statt geraten; bitte melden Sie sie."
W_VALIDATION_UNREPAIRABLE = "Der Validator meldete {message_id}. Das Problem ist echt, und es gibt keine automatische Behebung, die nicht den Text Ihres Buches verändern würde."
W_XHTML_OVERSIZE = "Eine Kapiteldatei ist größer als die Grenze, ab der manche Leseprogramme langsam werden, und ließ sich an keiner Absatzgrenze teilen."
