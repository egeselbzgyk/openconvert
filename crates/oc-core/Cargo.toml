[package]
name         = "oc-core"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Pipeline orchestrator: stages, ledger checks, escalation, repair loop, report, thresholds"
publish      = false

[dependencies]
oc-model = { path = "../oc-model", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
rayon.workspace = true
tracing.workspace = true
thiserror.workspace = true
secrecy.workspace = true
ctrlc.workspace = true
getrandom.workspace = true
# PNG encoding of the raster handed to `tesseract` (PHASE 13 detail 2). Already in the graph through
# `oc-epub` and `pdfium-render`, with the same two codecs.
image.workspace = true

# The sandbox (PHASE 14): `RLIMIT_AS` and the parent-death signal through rustix's safe wrappers,
# Landlock through its own crate; on Windows a job object through win32job. No `unsafe` of ours.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true

[target.'cfg(windows)'.dependencies]
win32job.workspace = true

[dev-dependencies]
insta.workspace = true
proptest.workspace = true
# Test-only: `every_provisional_has_owner_and_future_review` needs today's date to decide
# whether a `review_by` has expired. The shipped crate has no clock dependency.
time.workspace = true

[build-dependencies]
toml.workspace = true
serde.workspace = true
