[package]
name         = "oc-testkit"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Test-only: fixture builders, assertion runner, structural digest, stub LLM server"
publish      = false

# The stub llama-server and the minimal engine that drives `oc_core::sidecar` in the lifecycle tests
# (PHASE 9 rows 9.8–9.13). This crate is dev-only and never shipped, and `CARGO_BIN_EXE_*` is only
# visible to this package's own tests, which is why the sidecar tests live here.
[[bin]]
name = "oc-stub-llama-server"
path = "src/bin/oc-stub-llama-server.rs"
test = false

[[bin]]
name = "oc-sidecar-engine"
path = "src/bin/oc-sidecar-engine.rs"
test = false

[dependencies]
oc-model = { path = "../oc-model", version = "0.1.0" }
oc-core = { path = "../oc-core", version = "0.1.0" }
oc-net = { path = "../oc-net", version = "0.1.0" }
oc-ai = { path = "../oc-ai", version = "0.1.0" }
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
pdf-writer.workspace = true
lopdf.workspace = true
