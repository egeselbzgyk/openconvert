[package]
name         = "oc-ai"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "LlmProvider trait, prompts, GBNF grammars, cache, the four gates, cassettes"
publish      = false

[features]
default = []
live-llm = []

# `oc-model` is the only workspace crate this one may depend on (DECISIONS.md Appendix A). Every
# number the crate needs — the call budget, gate V's epsilons, the token cap — is therefore passed
# in by its caller, which reads `oc_core::thresholds::T`; the tests read the same `T`, which is why
# `oc-core` is a dev-dependency and never a normal one. `oc-net` depends on this crate and must not
# reach `oc-core` through it (ARCHITECTURE §3.1).
[dependencies]
oc-model = { path = "../oc-model", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
oc-core = { path = "../oc-core", version = "0.1.0" }
# Only to hold gate V's restatement of the Gopher statistics equal to oc-text's own.
oc-text = { path = "../oc-text", version = "0.1.0" }
insta.workspace = true
proptest.workspace = true
# Test 8.15 reads Cargo.lock and deny.toml.
toml.workspace = true
