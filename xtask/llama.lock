# The llama.cpp release the engine's `llama-server` sidecar comes from (D8, IMPLEMENTATION_PLAN
# PHASE 9 detail 1). One CPU build per arch: GGML_CPU_ALL_VARIANTS dispatches the ISA at runtime
# (V1 §3), so there are no avx/avx2/avx512 variants to choose between.
#
# Pinned by digest, as EPUBCheck and PDFium are. Moving the pin is a reviewed commit that carries
# the new digests, and **re-runs the whole model gate** (D9: V1 §4 records a CPU-backend regression
# that made one model 17x slower between consecutive builds).
#
# The tag and asset names are V1 §3's (github.com/ggml-org/llama.cpp/releases/tag/b10456, read
# 2026-08-17). The digests are placeholders: this repository's Phase 9 was built where github.com
# release assets could not be downloaded, so nobody here has hashed them. `fetch-llama-server`
# refuses to run until they are filled. See docs/DECISIONS_LOG.md, 2026-09-23.

