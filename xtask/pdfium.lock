# Pinned PDFium binary release, vendored by `cargo run -p xtask -- vendor-pdfium` (D3).
#
# `build` is the Chromium build number and must equal three things at once:
#   1. the `pdfium_<build>` feature selected for `pdfium-render` in the workspace Cargo.toml,
#   2. `oc_pdf::pdfium::EXPECTED_PDFIUM_BUILD`,
#   3. BUILD= in the VERSION file inside the archive.
# `xtask vendor-pdfium` checks (1) and (3); test 0.7 checks (2) and the VERSION file of the
# library it actually bound. Bumping PDFium therefore means editing all three in one commit.
#
# Digests were taken from the GitHub release API and independently re-computed from the
# downloaded archive (see docs/DECISIONS_LOG.md).

