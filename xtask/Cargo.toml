[package]
name         = "xtask"
version.workspace      = true
edition.workspace      = true
rust-version.workspace = true
license.workspace      = true
repository.workspace   = true
description  = "Developer tasks: fixtures, thresholds-lint, ci-lint, vendor-pdfium, stage-sidecars"
publish      = false

[lib]
name = "xtask"
path = "src/lib.rs"

[[bin]]
name = "xtask"
path = "src/main.rs"

[features]
# The release job's gates over real artefacts (PHASE 15 rows 15.6, 15.7, 15.15, 15.20). They read
# the bundle directory from `OC_BUNDLE_DIR` (and the published release from `OC_RELEASE_BODY` and
# `OC_RELEASE_ASSETS`); with the feature on and a variable unset, they fail. Gated rather than
# skipped (IMPLEMENTATION_PLAN §0.2): `release.yml` turns it on after bundling.
release-artifacts = []

[dependencies]
oc-core = { path = "../crates/oc-core", version = "0.1.0" }
oc-testkit = { path = "../crates/oc-testkit", version = "0.1.0" }
oc-epub = { path = "../crates/oc-epub", version = "0.1.0" }
oc-validate = { path = "../crates/oc-validate", version = "0.1.0" }
oc-model = { path = "../crates/oc-model", version = "0.1.0" }
oc-pdf = { path = "../crates/oc-pdf", version = "0.1.0" }
# `dom-fixtures` converts the fixtures through the one pipeline the CLI drives, rather than
# shelling out to the binary or building a second driver — the DOM checks assert things about the
# markup a user gets, so they have to be given exactly that markup (D13.1).
openconvert = { path = "../crates/openconvert", version = "0.1.0" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
sha2.workspace = true
zip.workspace = true
lopdf.workspace = true
typst.workspace = true
typst-pdf.workspace = true
typst-layout.workspace = true
typst-assets.workspace = true

[dev-dependencies]
# The release tests read the macOS entitlements plist (PHASE 15 row 15.5).
quick-xml.workspace = true
