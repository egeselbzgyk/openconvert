# The EPUBCheck release this repository validates against (D6, IMPLEMENTATION_PLAN Phase 5).
#
# Pinned by digest, not by version, for the same reason PDFium is: a release asset that is
# re-uploaded — which does happen — would silently change what the gate means. Moving the pin
# is a reviewed commit that has to carry the new digest.
#
# EPUBCheck is BSD-3-Clause, which is on D15's allow-list. It is never bundled into a shipped
# artefact: CI downloads it, and in-app it arrives with the optional validation pack (D6).

