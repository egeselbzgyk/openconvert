<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OpenConvert · scaled render</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="tokens.css">
<link rel="stylesheet" href="oc.css">
<link rel="stylesheet" href="gallery.css"><script>document.documentElement.style.fontSize=(new URLSearchParams(location.search).get("scale")||"100")+"%";</script><style>html,body{height:100%;margin:0}.oc-app{height:100%;min-width:0;min-height:0}</style>
</head>
<body>
<div class="oc-app" id="app" data-lang="en" lang="en"></div>
<template id="t-queue"><main class="oc-main"><div class="oc-dropzone oc-dropzone--strip" role="group" aria-label="Add PDFs"><span class="oc-tile oc-tile--accent"><svg class="oc-icon oc-icon--md"><use href="#i-fileplus"></use></svg></span><span class="oc-dropzone__title" data-i18n="drop.more">Drop more PDFs here</span><button class="oc-btn oc-btn--sm"><span data-i18n="drop.select">Select PDF…</span></button></div>
<ul class="oc-queue" aria-label="Queue">
<li class="oc-row oc-row--expanded"><div class="oc-row__line"><span class="oc-tile oc-tile--ok"><svg class="oc-icon oc-icon--md"><use href="#i-check"></use></svg></span><div class="oc-row__text"><span class="oc-row__name">the-wheels-of-chance.pdf</span><span class="oc-row__status"><b data-i18n="stage.complete">Complete</b></span></div><button class="oc-btn oc-btn--icon" aria-label="Collapse result" data-i18n-label="result.collapse" aria-expanded="true"><svg class="oc-icon oc-icon--md"><use href="#i-chevup"></use></svg></button></div>
<div class="oc-output"><svg class="oc-icon oc-icon--lg"><use href="#i-book"></use></svg><div class="oc-output__file"><span class="oc-output__name">the-wheels-of-chance.epub</span><span class="oc-output__path" data-i18n="x.pathBooks">~/Books</span></div><button class="oc-btn oc-btn--primary"><span data-i18n="result.open">Open in reader</span></button><button class="oc-btn"><span data-i18n="result.show">Show in folder</span></button></div>
<div class="oc-summary"><span class="oc-summary__counts" data-i18n="x.summary">214 pages · 1,842 blocks · 12 images · 0 tables · 11 chapters</span><span data-i18n="result.deterministic">Deterministic processing</span></div>
<div class="oc-validation oc-validation--warn"><span class="oc-validation__head"><svg class="oc-icon oc-icon--md"><use href="#i-alert"></use></svg><span data-i18n="validation.warn">Validation: passed with warnings (2)</span></span>
<ul class="oc-validation__list"><li class="oc-warning oc-warning--warn"><button class="oc-pagelink" data-i18n="x.p34">p. 34</button><span class="oc-warning__text" data-i18n="warn.W_DEHYPHEN_LOWCONF">Low-confidence hyphenation join kept as hyphenated</span></li><li class="oc-warning oc-warning--warn"><button class="oc-pagelink" data-i18n="x.p201">p. 201</button><span class="oc-warning__text" data-i18n="warn.W_IMAGE_LOWRES">1 image below minimum resolution</span></li></ul></div>
<div class="oc-facts"><div class="oc-fact"><div class="oc-fact__value" data-i18n="x.ret">99.6 %</div><div class="oc-fact__label" data-i18n="facts.retention">Character retention</div></div><div class="oc-fact"><div class="oc-fact__value" data-i18n="x.img">12 of 12</div><div class="oc-fact__label" data-i18n="facts.images">Images</div></div><div class="oc-fact"><div class="oc-fact__value" data-i18n="x.notes">38 of 38</div><div class="oc-fact__label" data-i18n="facts.notes">Notes linked</div></div><div class="oc-fact oc-fact--wide"><div class="oc-fact__value" data-i18n="facts.notRun">Not run</div><div class="oc-fact__label" data-i18n="x.checkNote">EPUBCheck · validation pack not installed</div></div></div>
<div class="oc-actions"><button class="oc-btn oc-btn--sm"><span data-i18n="action.details">Details</span></button><button class="oc-btn oc-btn--sm"><span data-i18n="action.preview">Preview</span></button><button class="oc-btn oc-btn--sm"><span data-i18n="action.editMeta">Edit metadata</span></button><button class="oc-btn oc-btn--sm"><span data-i18n="action.reviewToc">Review TOC</span></button><button class="oc-btn oc-btn--quiet oc-btn--sm"><span data-i18n="action.exportDiag">Export diagnostic bundle</span></button></div></li>
<li class="oc-row oc-row--running oc-row--compact"><div class="oc-row__line"><div class="oc-row__text"><span class="oc-row__name">moby-dick.pdf</span><span class="oc-row__status"><b data-i18n="stage.reconstructing">Reconstructing</b><span class="oc-num" data-i18n="x.progress">132 of 214 pages · 62 %</span></span></div><button class="oc-btn oc-btn--sm"><span data-i18n="queue.cancel">Cancel</span></button></div><div class="oc-row__detail" style="padding-left:0"><div class="oc-progress"><div class="oc-progress__fill" style="width:62%"></div></div></div></li>
<li class="oc-row oc-row--compact"><div class="oc-row__line"><div class="oc-row__text"><span class="oc-row__name">malleus-maleficarum.pdf</span><span class="oc-row__status" data-i18n="queue.queued">Queued (#2)</span></div><button class="oc-btn oc-btn--quiet oc-btn--sm"><span data-i18n="queue.remove">Remove</span></button></div></li>
</ul></main><header class="oc-header"><span class="oc-header__title"><svg class="oc-logo" aria-hidden="true"><use href="#oc-logo-sm"></use></svg>OpenConvert</span><span class="oc-header__spacer"></span><button class="oc-btn oc-btn--sm"><svg class="oc-icon oc-icon--md"><use href="#i-gear"></use></svg><span data-i18n="app.settings">Settings</span></button></header></template><template id="t-empty"><main class="oc-main"><div class="oc-dropzone" role="group" aria-label="Add PDFs"><span class="oc-tile oc-tile--lg oc-tile--accent"><svg class="oc-icon oc-icon--xl"><use href="#i-fileplus"></use></svg></span><span class="oc-dropzone__title" data-i18n="drop.title">Drop PDF here</span><span class="oc-dropzone__or"><span data-i18n="drop.or">or</span> <button class="oc-btn oc-btn--primary"><span data-i18n="drop.select">Select PDF…</span></button></span></div>
<p class="oc-privacy"><svg class="oc-icon "><use href="#i-monitor"></use></svg><span data-i18n="privacy.line">Everything runs on this computer: no account, no telemetry, no network use while converting.</span></p>
<section class="oc-card oc-card--firstrun"><p data-i18n="firstrun.body">AI-assisted structure detection is available and off by default. It can improve heading and chapter detection on ambiguous documents.</p><div class="oc-card__costs"><span data-i18n="firstrun.costs">Costs:</span><span class="oc-chip" data-i18n="firstrun.cost.download">~1,100 MB download</span><span class="oc-chip" data-i18n="firstrun.cost.ram">~1–2 GB RAM while converting</span><span class="oc-chip" data-i18n="firstrun.cost.time">a few extra seconds per book</span></div><div class="oc-card__actions"><button class="oc-btn"><span data-i18n="firstrun.setup">Set up AI assistance</span></button><button class="oc-btn oc-btn--quiet"><span data-i18n="firstrun.notnow">Not now</span></button></div></section></main><header class="oc-header"><span class="oc-header__title"><svg class="oc-logo" aria-hidden="true"><use href="#oc-logo-sm"></use></svg>OpenConvert</span><span class="oc-header__spacer"></span><button class="oc-btn oc-btn--sm"><svg class="oc-icon oc-icon--md"><use href="#i-gear"></use></svg><span data-i18n="app.settings">Settings</span></button></header></template>
<script>(function(){const p=new URLSearchParams(location.search);const s=p.get('screen')||'queue';const app=document.getElementById('app');app.innerHTML=document.getElementById('t-'+s).innerHTML;const l=p.get('lang')||'en';app.setAttribute('data-lang',l);if(p.get('theme'))document.documentElement.setAttribute('data-theme',p.get('theme'));})();</script>
<script src="gallery.js"></script></body></html>
